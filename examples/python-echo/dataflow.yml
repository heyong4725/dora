nodes:
  - id: sender
    path: sender.py
    build: pip install pyarrow
    inputs:
      tick: dora/timer/millis/500
    outputs:
      - data

  - id: echo
    path: echo.py
    build: pip install pyarrow
    inputs:
      data: sender/data
    outputs:
      - data

  - id: checker
    path: checker.py
    build: pip install pyarrow
    inputs:
      data: echo/data
